<!DOCTYPE html>
<html lang="id" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velora Tech - Digital Innovation</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
</head>

<body class="bg-white dark:bg-[#151323] text-slate-800 dark:text-white font-sans transition-colors duration-300">
    
    <!-- 1. NAVBAR -->
    <nav class="sticky top-0 z-50 bg-white dark:bg-[#151323] border-b border-slate-200 dark:border-slate-700">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">

            <h1 class="text-2xl font-extrabold tracking-wide text-violet-600">
                VELORA<span class="text-slate-800 dark:text-white">.</span>
            </h1>

            <div class="hidden md:flex items-center gap-9 text-sm font-medium">
                <a href="#home" class="hover:text-violet-500 transition">Home</a>
                <a href="#features" class="hover:text-violet-500 transition">Features</a>
                <a href="#pricing" class="hover:text-violet-500 transition">Pricing</a>
                <a href="#footer" class="hover:text-violet-500 transition">Contact</a>
            </div>

            <div class="flex items-center gap-3">

                <button onclick="toggleDark()"
                    class="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-violet-100 dark:hover:bg-slate-700 transition">
                    <span id="modeIcon">☀️</span>
                </button>

                <button onclick="toggleMenu()" class="md:hidden text-2xl">
                    ☰
                </button>

            </div>
        </div>

        <div id="mobileMenu" class="hidden md:hidden px-6 pb-5 space-y-4 bg-white dark:bg-[#151323]">
            <a href="#home" class="block">Home</a>
            <a href="#features" class="block">Features</a>
            <a href="#pricing" class="block">Pricing</a>
            <a href="#footer" class="block">Contact</a>
        </div>
    </nav>
